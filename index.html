<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vui Học Cùng Con</title>
<script>
  const hash = (window.location.hash || '').replace('#', '').toLowerCase();
  const search = new URLSearchParams(window.location.search);
  const sec = (search.get('section') || hash).toLowerCase();

  if (sec === 'schedule' || sec === 'tkb') {
    window.location.replace('schedule.html');
  } else if (sec === 'tools' || sec === 'flashcards' || sec === 'hoctap') {
    window.location.replace('tools.html');
  } else if (sec === 'achievements' || sec === 'thanhtich') {
    window.location.replace('achievements.html');
  } else if (sec === 'rewards' || sec === 'doiqua') {
    window.location.replace('rewards.html');
  } else {
    window.location.replace('today.html');
  }
</script>
<meta http-equiv="refresh" content="0; url=today.html">
</head>
<body style="font-family:sans-serif;text-align:center;padding:50px">
  <h2>Đang chuyển hướng đến <a href="today.html">Vui Học Cùng Con</a>...</h2>
</body>
</html>
